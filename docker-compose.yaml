services:

  log:
    build:
      context: ${PROJECT_ROOT}
      dockerfile: ${PROJECT_ROOT}/services/Log/cmd/Dockerfile
    container_name: log-service
    environment:
      - LOGGER_AUTH_LEVEL=${LOGGER_LEVEL}
      - LOGGER_AUTH_FOLDER=/app/out/logs/auth
      - LOGGER_GEO_LEVEL=${LOGGER_LEVEL}
      - LOGGER_GEO_FOLDER=/app/out/logs/geo
      - LOGGER_ROOM_LEVEL=${LOGGER_LEVEL}
      - LOGGER_ROOM_FOLDER=/app/out/logs/rooms
      - LOG_REDIS_HOST=navigation-redis
      - LOG_REDIS_PORT=6379
      - LOG_REDIS_PASSWORD=${REDIS_PASSWORD}
      - LOG_REDIS_TIMEOUT=${REDIS_TIMEOUT}
      - LOG_KAFKA_CONSUMER_ADDRESS=${KAFKA_ADDRESS}
      - LOG_KAFKA_CONSUMER_AUTH_TOPIC=${LOG_AUTH_TOPIC}
      - LOG_KAFKA_CONSUMER_AUTH_GROUP_ID=${LOG_AUTH_GROUP_ID}
      - LOG_KAFKA_CONSUMER_GEO_TOPIC=${LOG_AUTH_TOPIC}
      - LOG_KAFKA_CONSUMER_GEO_GROUP_ID=${LOG_AUTH_GROUP_ID}
      - LOG_KAFKA_CONSUMER_ROOMS_TOPIC=${LOG_AUTH_TOPIC}
      - LOG_KAFKA_CONSUMER_ROOMS_GROUP_ID=${LOG_AUTH_GROUP_ID}
    volumes:
      - ${PROJECT_ROOT}/out/logs:/app/out/logs
    ports:
      - "7070:7070"

  navigation-postgres-db:
    image: postgres:18.1-bookworm
    container_name: db
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - ${PROJECT_ROOT}/out/pg_data:/var/lib/postgresql:z
    restart: always
  
  navigation-postgres-db-migrate:
    image: migrate/migrate:v4.19.1
    volumes:
      - ${PROJECT_ROOT}/migrations:/migrations
  
  navigation-redis:
    image: redis:7.4
    container_name: redis
    command: redis-server --requirepass ${REDIS_PASSWORD}
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    volumes:
      - ${PROJECT_ROOT}/out/redis_data:/data
    restart: always
  
  navigation-kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@navigation-kafka:29093'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://navigation-kafka:29092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_LOG_DIRS: '/var/lib/kafka/data'
      CLUSTER_ID: '4L62IdMvTq63p1C7FgcMzQ'