<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход в систему</title>
    <link rel="stylesheet" href="register_style.css">
    <script src="auth.js" defer></script>
</head>
<body>

    <div class="auth-container">
        <h2>Авторизация</h2>
        <p class="subtitle">Введи свой логин и пароль</p>
        
        <form action="https://localhost:8443/api/auth/login" method="POST">
            <div class="input-group">
                <label>Электронная почта (Логин)</label>
                <input type="email" name="email" placeholder="Student_capusto" required>
            </div>
            
            <div class="input-group">
                <label>Пароль</label>
                <input type="password" name="password" placeholder="••••••••" required>
            </div>
            
            <button type="submit" class="btn-primary">Войти</button>
        </form>
        
        <a href="welcome.html" class="back-link">← Вернуться на главную</a>
    </div>

</body>
</html>
